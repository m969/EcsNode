  <rect x="2" y="192" width="60" height="24" rx="6" ry="6" fill="white" stroke="black"/>
  <text x="10" y="210">军队</text>
  <rect x="2" y="232" width="60" height="24" rx="6" ry="6" fill="white" stroke="black"/>
  <text x="10" y="250">联盟</text>
  <rect x="2" y="272" width="60" height="24" rx="6" ry="6" fill="white" stroke="black"/>
