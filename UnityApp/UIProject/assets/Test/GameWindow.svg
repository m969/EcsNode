  <rect x="1180" y="100" width="100" height="320" fill="none" stroke="black"/>
  <rect x="1182" y="112" width="60" height="24" rx="6" ry="6" fill="white" stroke="black"/>
  <text x="1190" y="130">部队</text>
  <rect x="1182" y="152" width="60" height="24" rx="6" ry="6" fill="white" stroke="black"/>
