<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" style="background:white; font-family:Arial, sans-serif; font-size:16;">
  <!-- 顶部栏（横屏） -->
  <rect x="0" y="0" width="1280" height="80" fill="white" stroke="black"/>
