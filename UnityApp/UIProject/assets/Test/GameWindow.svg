  <!-- 底部导航栏 -->
  <rect x="0" y="560" width="1280" height="160" fill="white" stroke="black"/>
  <rect x="72" y="582" width="60" height="24" rx="6" ry="6" fill="white" stroke="black"/>
  <text x="80" y="600">英雄</text>
  <rect x="232" y="582" width="60" height="24" rx="6" ry="6" fill="white" stroke="black"/>
